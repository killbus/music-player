name: "Publish tags to FlakeHub"

# Fork gate (D3): upstream published the flake on every matching tag push, which
# would send the fork's tree to upstream's FlakeHub project as soon as the fork
# pushes its own release tag. The fork keeps the workflow but runs it only by
# explicit dispatch against an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish to FlakeHub"
        type: "string"
        required: true
jobs:
  flakehub-publish:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}"
      - uses: "DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa" # v23
      - uses: "DeterminateSystems/flakehub-push@e001ee821cdb763ef120c01f1048bfb2f938bb9c" # v7
        with:
          visibility: "public"
          name: "tsirysndr/music-player"
          tag: "${{ inputs.tag }}"