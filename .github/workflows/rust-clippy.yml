name: rust-clippy analyze

on:
  push:
    branches: ["master", "migration/upstream-0.4.7", 'migration/upstream-0.4.7-clean']
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["master"]
  schedule:
    - cron: "16 10 * * 5"

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Dagger
        uses: ./.github/actions/setup-dagger
      - name: Analyze with Clippy
        run: dagger --progress logs -v api call -m .dagger/ci clippy --source . export --path artifacts/rust-clippy-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: artifacts/rust-clippy-results.sarif
          wait-for-processing: true
